<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consulting Interview Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#121212; --card:#1c1c1c; --line:#2e2e2e; --ink:#f1ece4; --soft:#a9a49b; --btn:#c58b62; --btn-ink:#161616; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Source Sans Pro", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  main {
    width: 100%; max-width: 680px; text-align: center; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 52px 36px 48px;
  }
  h1 { margin: 0 0 16px; font-size: 2.2rem; font-weight: 700; line-height: 1.15; }
  p { margin: 0 auto 36px; max-width: 540px; font-size: 1.15rem; line-height: 1.6; color: var(--soft); }
  .enter {
    display: inline-block; min-width: 260px; padding: 20px 64px; border-radius: 10px;
    background: var(--btn); color: var(--btn-ink); text-decoration: none; font-size: 1.6rem; font-weight: 700;
    letter-spacing: .02em; transition: opacity .12s ease;
  }
  .enter:hover, .enter:focus-visible { opacity: .88; outline: none; }
  @media (max-width: 520px) { h1 { font-size: 1.8rem; } .enter { min-width: 0; width: 100%; padding: 18px 0; } }
</style>
</head>
<body>
  <main>
    <h1>Consulting Interview Coach</h1>
    <p>A team of four AI agents that researches your target firm, builds a prep plan, runs mock case and behavioral interviews by typing or speaking, and gives you honest feedback.</p>
    <a class="enter" href="https://coach-30933524946.us-central1.run.app">Enter</a>
  </main>
</body>
</html>
